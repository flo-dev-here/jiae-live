/* 레이아웃: 조각마다 스테이지 하나. 26px 여백 안에 둥근 카드, 글자는 가운데 정렬 */
.pc{--ink:#1F1A1E; --accent:#DE7BA2; --edge:#F2BACD; --paper1:#FFFBFC; --paper2:#FDE6EE;
  position:relative; font-family:"KJua","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink)}
.pc[data-color="rose"]{--ink:#A83E70}
.pc .card{position:absolute; inset:26px; border-radius:34px; box-sizing:border-box;
  background:linear-gradient(180deg,var(--paper1),var(--paper2)); border:3px solid var(--edge);
  box-shadow:0 0 0 1px rgba(217,110,150,.18), 0 0 14px 2px rgba(244,143,181,.28);
  display:flex; align-items:center; justify-content:center; overflow:hidden; isolation:isolate}
.pc .card::before{content:""; position:absolute; inset:8px; border-radius:25px; border:3px dashed #EBADC3; opacity:.7; pointer-events:none}
.pc .card::after{content:""; position:absolute; top:-30%; bottom:-30%; left:-180px; width:110px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55) 50%,transparent); transform:skewX(-20deg);
  animation:pcSheen 6s cubic-bezier(.45,.05,.35,1) infinite; pointer-events:none}
@keyframes pcSheen{0%{transform:translateX(0) skewX(-20deg)} 22%,100%{transform:translateX(1100px) skewX(-20deg)}}
.pc .card.col{flex-direction:column; gap:6px}
.pc .card.row .in{display:flex; flex:none; gap:16px; align-items:baseline; padding-top:4px; position:relative; z-index:1}
.pc .t{white-space:nowrap; line-height:1.08; position:relative; z-index:1;
  text-shadow:3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,2.2px 2.2px 0 #fff,-2.2px 2.2px 0 #fff,2.2px -2.2px 0 #fff,-2.2px -2.2px 0 #fff, 0 5px 8px rgba(120,60,90,.18)}
.pc .stack{display:flex; flex-direction:column; align-items:flex-start; gap:6px; position:relative; z-index:1} .pc .t38{font-size:38px} .pc .line.sm{gap:10px} .pc .line.sm .ico.heart{width:42px; height:42px} .pc .t58{font-size:58px} .pc .t84{font-size:84px} .pc .pill.inl{margin-top:0; align-self:center} .pc .t44{font-size:44px} .pc .t50{font-size:50px} .pc .t52{font-size:52px} .pc .t64{font-size:64px} .pc .t92{font-size:92px} .pc .t96{font-size:96px}
.pc .pill{margin-top:8px; padding:6px 26px 8px; border-radius:999px; background:linear-gradient(180deg,#F3A7C3,var(--accent)); box-shadow:0 0 0 3px #fff, 0 3px 8px rgba(201,96,138,.3); position:relative; z-index:1}
.pc .pill .t{color:#fff; text-shadow:0 2px 0 rgba(150,50,95,.55)}
.pc .line{display:flex; align-items:center; gap:14px; position:relative; z-index:1}
.pc .ico{flex:none; position:relative; z-index:1}
.pc .ico.heart{width:54px; height:54px; fill:var(--accent); filter:drop-shadow(0 0 0 #fff) drop-shadow(0 2px 3px rgba(201,96,138,.35)); animation:pcBeat 1.8s ease-in-out infinite}
.pc .ico.guitar{width:84px; height:84px; align-self:center; margin:-8px 0 0 -6px; animation:pcRock 2.4s ease-in-out infinite alternate; transform-origin:30% 70%}
@keyframes pcBeat{0%,100%{transform:scale(1)} 50%{transform:scale(1.14)}}
@keyframes pcRock{from{transform:rotate(-5deg)} to{transform:rotate(6deg)}}
.pc svg.deco{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.pc .spk{fill:#fff; filter:drop-shadow(0 0 4px #E98BAE)}
.pc .tw{transform-box:fill-box; transform-origin:center; animation:pcTw var(--d,3s) ease-in-out var(--dl,0s) infinite}
@keyframes pcTw{0%,100%{opacity:.35; transform:scale(.6)} 50%{opacity:1; transform:scale(1)}}
/* ───── 화려한 모션 (data-motion="high"). 주소 뒤 &m=low 로 끌 수 있음 ───── */
.pc .hi{display:none}
.pc[data-motion="high"] .hi, .pc[data-motion="mid"] .hi{display:inline}
.pc[data-motion="high"] .card{animation:pcIn .8s cubic-bezier(.2,1.5,.4,1) both, pcFloat 3.2s ease-in-out .8s infinite, pcGlow 2.4s ease-in-out infinite alternate}
.pc[data-motion="high"] svg.deco{animation:pcInFade .8s ease-out both, pcFloat 3.2s ease-in-out .8s infinite}
@keyframes pcIn{0%{opacity:0; transform:scale(.55) rotate(-4deg)} 60%{opacity:1} 100%{opacity:1; transform:scale(1) rotate(0)}}
@keyframes pcInFade{0%,40%{opacity:0} 100%{opacity:1}}
@keyframes pcFloat{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}
@keyframes pcGlow{from{box-shadow:0 0 0 1px rgba(217,110,150,.18), 0 0 10px 2px rgba(244,143,181,.35)} to{box-shadow:0 0 0 1px rgba(217,110,150,.18), 0 0 22px 7px rgba(196,160,255,.6), 0 0 8px 2px rgba(255,200,225,.9)}}
.pc[data-motion="high"] .card::after{width:150px; animation-duration:3s; background:linear-gradient(90deg,transparent,rgba(255,255,255,.85) 50%,transparent)}
.pc .run rect{fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; stroke-dasharray:7 93; filter:drop-shadow(0 0 5px #FF8FC0) drop-shadow(0 0 2px #fff); animation:pcRun 4s linear infinite}
@keyframes pcRun{from{stroke-dashoffset:100} to{stroke-dashoffset:0}}
.pc .tw.gold{fill:#FFD76A; filter:drop-shadow(0 0 4px #FFB300)}
.pc[data-motion="high"] .tw{animation-name:pcTwHi; animation-duration:calc(var(--d,3s) * .6)}
@keyframes pcTwHi{0%,100%{opacity:.15; transform:scale(.4) rotate(0)} 50%{opacity:1; transform:scale(1.25) rotate(45deg)}}
.pc .wv{display:inline-block}
.pc[data-motion="high"] .wv{animation:pcWave 2.2s ease-in-out infinite; animation-delay:calc(var(--i) * .12s)}
@keyframes pcWave{0%,55%,100%{transform:translateY(0)} 25%{transform:translateY(-9px)}}
.pc[data-motion="high"] .pulse{animation:pcPulse 1.5s ease-in-out infinite}
@keyframes pcPulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.07)}}
.pc[data-motion="high"] .pill{animation:pcPill 1.5s ease-in-out infinite}
@keyframes pcPill{0%,100%{box-shadow:0 0 0 3px #fff, 0 3px 8px rgba(201,96,138,.3)} 50%{box-shadow:0 0 0 3px #fff, 0 0 16px 5px rgba(255,120,175,.75)}}
.pc[data-motion="high"] .ico.heart{animation:pcBeatHi 1s ease-in-out infinite}
@keyframes pcBeatHi{0%,100%{transform:scale(1)} 20%{transform:scale(1.28)} 40%{transform:scale(1.02)} 60%{transform:scale(1.2)}}
.pc[data-motion="high"] .ico.guitar{animation:pcRockHi .9s ease-in-out infinite alternate}
@keyframes pcRockHi{from{transform:rotate(-12deg)} to{transform:rotate(12deg)}}
.pc .rise{transform-box:fill-box; transform-origin:center; opacity:0; animation:pcRise var(--d,2.6s) ease-out var(--dl,0s) infinite}
.pc .rise.heart{fill:#FF7FB2; stroke:#fff; stroke-width:.8}
.pc .rise.note{stroke:var(--accent)}
/* ───── 중간 모션 (data-motion="mid") = 은은함 0 ↔ 화려함 100 사이의 20 ───── */
.pc[data-motion="mid"] .card{animation:pcInMid .6s ease-out both, pcFloatMid 3.6s ease-in-out .6s infinite, pcGlowMid 3s ease-in-out infinite alternate}
.pc[data-motion="mid"] svg.deco{animation:pcInFade .6s ease-out both, pcFloatMid 3.6s ease-in-out .6s infinite}
@keyframes pcInMid{0%{opacity:0; transform:scale(.95)} 100%{opacity:1; transform:scale(1)}}
@keyframes pcFloatMid{0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.2px)}}
@keyframes pcGlowMid{from{box-shadow:0 0 0 1px rgba(217,110,150,.18), 0 0 12px 2px rgba(244,143,181,.3)} to{box-shadow:0 0 0 1px rgba(217,110,150,.18), 0 0 15.5px 3px rgba(228,160,220,.35)}}
.pc[data-motion="mid"] .card::after{width:118px; animation-duration:5.4s; background:linear-gradient(90deg,transparent,rgba(255,255,255,.61) 50%,transparent)}
.pc[data-motion="mid"] .run rect{stroke-width:2.5; opacity:.3; animation-duration:6.5s}
.pc[data-motion="mid"] .run rect + rect{display:none}
.pc[data-motion="mid"] .tw{animation-name:pcTwMid; animation-duration:calc(var(--d,3s) * .92)}
.pc[data-motion="mid"] .tw.gold{opacity:.3}
@keyframes pcTwMid{0%,100%{opacity:.31; transform:scale(.56) rotate(0)} 50%{opacity:1; transform:scale(1.05) rotate(9deg)}}
.pc[data-motion="mid"] .wv{animation:pcWaveMid 3.2s ease-in-out infinite; animation-delay:calc(var(--i) * .16s)}
@keyframes pcWaveMid{0%,55%,100%{transform:translateY(0)} 25%{transform:translateY(-1.8px)}}
.pc[data-motion="mid"] .pulse{animation:pcPulseMid 2s ease-in-out infinite}
@keyframes pcPulseMid{0%,100%{transform:scale(1)} 50%{transform:scale(1.014)}}
.pc[data-motion="mid"] .pill{animation:pcPillMid 2s ease-in-out infinite}
@keyframes pcPillMid{0%,100%{box-shadow:0 0 0 3px #fff, 0 3px 8px rgba(201,96,138,.3)} 50%{box-shadow:0 0 0 3px #fff, 0 0 8px 2px rgba(255,120,175,.28)}}
.pc[data-motion="mid"] .ico.heart{animation:pcBeatMid 1.64s ease-in-out infinite}
@keyframes pcBeatMid{0%,100%{transform:scale(1)} 50%{transform:scale(1.17)}}
.pc[data-motion="mid"] .ico.guitar{animation:pcRockMid 2.1s ease-in-out infinite alternate}
@keyframes pcRockMid{from{transform:rotate(-6.4deg)} to{transform:rotate(6.4deg)}}
.pc[data-motion="mid"] .rise{animation-name:pcRiseMid; animation-duration:calc(var(--d,2.6s) * 1.5)}
.pc[data-motion="mid"] svg.deco > g:last-of-type .rise, .pc[data-motion="mid"] svg.deco > g:nth-last-of-type(2) .rise{display:none}
@keyframes pcRiseMid{0%{opacity:0; transform:translate(0,8px) scale(.5)} 25%{opacity:.35} 100%{opacity:0; transform:translate(4px,-22px) scale(.9) rotate(5deg)}}
@keyframes pcRise{0%{opacity:0; transform:translate(0,10px) scale(.5)} 20%{opacity:1} 100%{opacity:0; transform:translate(10px,-46px) scale(1.15) rotate(14deg)}}

html,body{margin:0;padding:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
html{scrollbar-width:none} html::-webkit-scrollbar{display:none}
.pc{position:absolute;left:50%;top:50%;transform-origin:center;display:none}
.pc.on{display:block}
#all{position:absolute;left:50%;top:50%;width:820px;height:756px;transform-origin:center}
#all .pc{left:0;top:0;transform-origin:top left}

2 5.6-1.2 5.6 1.4 3.6 3.4 0 6Z" /></g></svg></div>
<script>

/* ═════════════ 설정: 여기만 바꾸면 됩니다 ═════════════ */
const CONFIG = {
  schedule: ["매주 월요일", "밤 10시", "정규방송"],
  name:     ["가수", "엄지애", "틱톡라이브"],
  request:  ["신청곡은", "팔로우 · 팀가입 후"],
  concert:  ["엄지애 연말콘서트", "12월 13일", "PM 5", "게시물을 참고하세요"],
  motion: "mid",         // 모션 세기: "low"(은은, 0) · "mid"(중간, 20) · "high"(화려, 100). 주소 뒤 &m=low 처럼 바꿀 수 있음
  pieceColor: {},   // 조각별 기본 글자색 (주소에 &c= 가 없을 때). 여기 없는 조각은 아래 color 를 따름
  color: "rose",        // 글자색 기본값: "black" 또는 "rose" (주소 뒤 &c=rose 로도 바꿀 수 있음)
  defaultPiece: "request"    // 주소에 ?p= 가 없을 때: "all"(세 조각 한 화면) 또는 조각 이름
};
/* 주소 예:  …netlify.app/?p=schedule   …/?p=name   …/?p=request   …/?p=concert   …/?p=all(모든 조각 한 화면)   (글자색: &c=rose) */
/* ══════════════════════════════════════════════════ */


function fillPiece(el, cfg){
  el.querySelectorAll('[data-k]').forEach(n => { const [k,i] = n.dataset.k.split('.'); const txt = (cfg[k]||[])[+i] || '';
    if (n.hasAttribute('data-wave')) { n.textContent = ''; [...txt].forEach((ch, j) => { const sp = document.createElement('span'); sp.className = 'wv'; sp.style.setProperty('--i', j); sp.textContent = ch === ' ' ? ' ' : ch; n.appendChild(sp); }); }
    else n.textContent = txt; });
  // 긴 문구가 카드 밖으로 넘치지 않게: 넘치면 글자를 조금씩 줄임 (최소 36px)
  const card = el.querySelector('.card'), max = card.clientWidth - 56;
  const ts = [...el.querySelectorAll('.t')]; ts.forEach(t => t.style.fontSize = '');
  const wide = () => Math.max(...[...card.children].map(c => c.scrollWidth));
  let guard = 0;
  while (wide() > max && guard++ < 80) ts.forEach(t => { const f = parseFloat(getComputedStyle(t).fontSize); if (f > 36) t.style.fontSize = (f - 1) + 'px'; });
}

(function(){
  const q = new URLSearchParams(location.search), h = location.hash.replace('#','');
  let p = q.get('p') || h || CONFIG.defaultPiece; if(!['schedule','name','request','concert','all'].includes(p)) p = CONFIG.defaultPiece;
  const cq = (q.get('c') === 'rose' || q.get('c') === 'black') ? q.get('c') : null;
  const colorOf = k => cq || (CONFIG.pieceColor || {})[k] || CONFIG.color;
  const m = ['low','mid','high'].includes(q.get('m')) ? q.get('m') : CONFIG.motion;
  // ?p=all : 모든 조각을 한 화면에 (이름 / 일정 + 신청곡 0.76배 / 콘서트 0.9배)
  const ALL = { name:[0,0,1], schedule:[0,204,.76], request:[334,246,.76], concert:[95,487,.9] };
  const keys = p === 'all' ? Object.keys(ALL) : [p];
  const els = keys.map(k => { const el = document.querySelector(`.pc[data-piece="${k}"]`); el.dataset.motion = m; el.dataset.color = colorOf(k); el.classList.add('on'); return el; });
  let box = els[0], W = box.offsetWidth, H = box.offsetHeight;
  if (p === 'all') {
    box = document.createElement('div'); box.id = 'all'; document.body.appendChild(box); W = 820; H = 756;
    els.forEach(el => { const [x,y,sc] = ALL[el.dataset.piece]; box.appendChild(el); el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = `scale(${sc})`; });
  }
  function layout(){
    const s = (innerWidth > 10 && innerHeight > 10) ? Math.min(innerWidth / W, innerHeight / H) : 1;   // 0×0 소스 대비
    box.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  const fillAll = () => els.forEach(el => fillPiece(el, CONFIG));
  fillAll(); layout(); addEventListener('resize', layout);
  if (document.fonts) document.fonts.ready.then(fillAll);
})();
</script>
